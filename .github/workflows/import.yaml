on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: ~

name: Import

jobs:
  recent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: data/wiki-meta-cache.yaml
          key: wiki-meta-cache-v2-${{ github.run_id }}
          restore-keys: |
            wiki-meta-cache-v2
      - name: Python dependencies
        run: pip install "steam[client]"
      - run: cargo build
      - run: cargo run -- bulk --recent-changes
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Import recent changes from PCGamingWiki
          commit_author: GitHub Actions <actions@github.com>
      - name: Update data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan data-temp
          git reset
          git add data/manifest.yaml data/missing.md data/steam-game-cache.yaml data/wiki-game-cache.yaml data/wiki-malformed.md

          git commit -m 'Update data files'
          git push origin data-temp:data --force
